[[experiments]]
name = "Short memory"
description = "same_decay = 0.1: every head forgets almost immediately. Effectively a bigram model again."
params = { same_decay = 0.1 }
[[experiments]]
name = "No decay"
description = "same_decay = 1: plain linear attention. Old tokens never fade, and quality drops: the decay is doing real work."
params = { same_decay = 1 }
