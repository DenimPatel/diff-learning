title = "Linear attention & state-space recurrence"
parent = "21-numpy-gpt"
variant = true
summary = "Drop the softmax and let attention fade with distance. The same layer then trains in parallel like a transformer and runs as an RNN with a fixed-size state, the idea behind RetNet, RWKV and Mamba-2."
tags = ["linear attention", "ssm", "rnn", "mamba", "long context"]
updated = 2026-10-14

