title = "DeepSeekMoE: fine-grained, shared experts and bias balancing"
parent = "25-mixture-of-experts"
variant = true
summary = "The MoE recipe of DeepSeek-V3 and most 2025–26 open MoEs: many small experts, an always-on shared expert, sigmoid routing, and load balancing by nudging a per-expert bias instead of adding an auxiliary loss."
tags = ["moe", "deepseek", "load balancing", "routing", "sparsity"]
updated = 2026-10-14

