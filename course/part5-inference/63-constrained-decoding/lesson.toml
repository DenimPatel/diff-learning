[[experiments]]
name = "A format the model never writes"
description = "'zz?': 0 of 300 free samples fit, so rejection sampling would never finish. With the mask, every output fits."
params = { template = "zz?" }
[[experiments]]
name = "Fixed first and last letter"
description = "'k????a': about 1% of free samples fit. Look for awkward endings like 'keniaa', where the model wanted to stop but had to keep going."
params = { template = "k????a" }
