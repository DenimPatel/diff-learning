title = "Constrained decoding"
parent = "60-kv-cache"
variant = true
summary = "Guarantee the output format by masking every token that would break it before sampling. This is the mechanism behind JSON mode, structured outputs and grammar-constrained tool calls."
tags = ["structured output", "json mode", "grammars", "inference", "decoding"]
updated = 2026-10-14

