[[experiments]]
name = "300 names, no dropout"
description = "1% of the data and a wider model: train loss goes toward 0.4 while val climbs past 6."
params = { data_fraction = 0.01, n_embd = 64, num_steps = 600, dropout_p = 0.0 }
[[experiments]]
name = "300 names, dropout 0.3"
description = "The same with dropout: val stays near 2.9. Overlay the two runs on the val chart."
params = { data_fraction = 0.01, n_embd = 64, num_steps = 600, dropout_p = 0.3 }
[[experiments]]
name = "All data, no dropout"
description = "With 29k names nothing overfits, so dropout only slows learning. Compare val with the default 0.1."
params = { dropout_p = 0.0 }
