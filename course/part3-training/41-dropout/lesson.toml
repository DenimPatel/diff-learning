title = "Dropout"
parent = "40-evaluation"
variant = true
summary = "Randomly zero activations while training so the network can't lean on any single unit. A strong regularizer when data is scarce, and unnecessary when it is plentiful."
tags = ["regularization", "dropout", "overfitting"]
updated = 2026-10-14

