title = "WSD schedule"
parent = "40-evaluation"
variant = true
summary = "Warmup, hold the peak learning rate, then cool down sharply at the end. Compare it with linear, cosine and constant schedules, and see why the loss drops so suddenly during the cooldown."
tags = ["learning rate", "schedule", "wsd", "training"]
updated = 2026-10-14

