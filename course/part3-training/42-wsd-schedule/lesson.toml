[[experiments]]
name = "Cosine"
description = "The long-time default (lesson 11): a smooth decay over the whole run."
params = { schedule = "cosine" }
[[experiments]]
name = "Constant"
description = "No decay at all: val stays on the plateau. The final cooldown is worth a lot."
params = { schedule = "constant" }
[[experiments]]
name = "Very short cooldown"
description = "decay_fraction = 0.05: only the last 15 steps decay. Most of the benefit still arrives."
params = { decay_fraction = 0.05 }
