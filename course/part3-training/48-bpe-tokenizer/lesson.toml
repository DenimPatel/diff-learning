[[experiments]]
name = "No merges"
description = "num_merges = 0 is the character tokenizer of lesson 40: 1 character per token."
params = { num_merges = 0 }
[[experiments]]
name = "150 merges"
description = "A bigger vocabulary: 1.6 characters per token and a lower val_bpc. Per-token loss goes *up*, because each token now carries more information."
params = { num_merges = 150 }
