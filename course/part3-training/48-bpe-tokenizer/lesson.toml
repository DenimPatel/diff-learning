title = "Byte-pair encoding (BPE)"
parent = "40-evaluation"
variant = true
summary = "Learn a tokenizer from the data: start from characters and repeatedly merge the most frequent adjacent pair. Fewer tokens per name, a longer effective context, and a lower loss per character."
tags = ["tokenization", "bpe", "data"]
updated = 2026-10-14

