[[experiments]]
name = "Reward hacking"
description = "Prefer short names with a 3x higher learning rate. Within 25 steps every sample is 'liked', because the model now writes one-letter names. It satisfied the preference and lost everything else."
params = { preference = "short", dpo_learning_rate = 0.001 }
[[experiments]]
name = "Stronger anchor"
description = "dpo_beta = 0.5 keeps the model closer to the reference: 'liked' rises almost as fast while the names loss stays much lower."
params = { dpo_beta = 0.5 }
[[experiments]]
name = "Starts with a vowel"
description = "A preference about the first token. Is it easier or harder to learn?"
params = { preference = "starts with a vowel" }
