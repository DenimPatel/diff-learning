title = "DPO: learning from preferences"
parent = "50-checkpoints"
variant = true
summary = "Align the model to what people prefer from (chosen, rejected) pairs, with no reward model and no RL: the DPO loss, a frozen reference model, β, and a reward-hacking demo."
tags = ["dpo", "preference optimization", "alignment", "rlhf", "post-training"]
updated = 2026-10-14

[[references]]
