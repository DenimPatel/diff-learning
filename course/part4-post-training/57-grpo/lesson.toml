[[experiments]]
name = "Hold on to the reference"
description = "kl_coef = 0.5: reward stops around 0.8, but the samples stay much more name-like."
params = { kl_coef = 0.5 }
[[experiments]]
name = "A hard reward"
description = "'same first and last letter': only ~2% of samples score at the start, so most groups are all-zero and teach nothing. Bigger groups and more steps help, and then the model hacks it with 'ahaha'."
params = { task = "same first and last letter", rl_learning_rate = 0.003, num_steps = 300, group_size = 16 }
[[experiments]]
name = "An easy reward"
description = "'exactly 6 letters' is solved in about a dozen steps."
params = { task = "exactly 6 letters" }
