title = "GRPO: RL with verifiable rewards"
parent = "50-checkpoints"
variant = true
summary = "The model samples groups of answers, a program scores them, and each answer is reinforced by how much it beat its group: group-relative advantages, PPO clipping and a KL penalty, the recipe behind reasoning models."
tags = ["grpo", "reinforcement learning", "rlvr", "ppo", "reasoning", "post-training"]
updated = 2026-10-14

