[[experiments]]
name = "No quantization"
description = "quant_type = none is exactly lesson 52. Compare exact match: 4 bits cost almost nothing."
params = { quant_type = "none" }
[[experiments]]
name = "int4 instead of NF4"
description = "Evenly spaced levels: the base model loses a little more than with NF4."
params = { quant_type = "int4" }
[[experiments]]
name = "Bigger groups"
description = "quant_group = 32: fewer scales, a bit more quantization error."
params = { quant_group = 32 }
